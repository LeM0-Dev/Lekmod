# .github/workflows/auto-sync.yml (only on sync-bot)

name: Auto Sync
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set upstream
        run: |
          git remote add upstream https://github.com/EnormousApplePie/Lekmod.git
          git fetch upstream

      - name: Sync main
        run: |
          git checkout main
          git merge upstream/main || true

      - name: Push
        run: git push origin main
